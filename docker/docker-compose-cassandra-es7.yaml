services:
  agentmesh-server:
    environment:
      - CONFIG_PROP=config-cassandra-es7.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false
      - agentmesh.app.ownerEmailMandatory=false
    image: agentmesh:server
    container_name: agentmesh-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS}
    networks:
      - internal
    ports:
      - 8000:8080
      - 8127:5000
    healthcheck:
      test: ['CMD', 'curl', '-I', '-XGET', 'http://localhost:8080/health']
      interval: 60s
      timeout: 30s
      retries: 12
    links:
      - agentmesh-cassandra:cassandradb
      - agentmesh-redis:rs
      - agentmesh-elasticsearch:es
    depends_on:
      agentmesh-cassandra:
        condition: service_healthy
      agentmesh-redis:
        condition: service_healthy
      agentmesh-elasticsearch:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '1k'
        max-file: '3'

  agentmesh-cassandra:
    image: cassandra:4
    environment:
      - CASSANDRA_CLUSTER_NAME=agentmesh
      - CASSANDRA_NUM_TOKENS=4
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'cqlsh', '-e', 'describe keyspaces']
      interval: 10s
      timeout: 10s
      retries: 20
    logging:
      driver: 'json-file'
      options:
        max-size: '1k'
        max-file: '3'

  agentmesh-redis:
    image: redis:6.2.3-alpine
    volumes:
      - ../server/config/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

  agentmesh-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    environment:
      - 'ES_JAVA_OPTS=-Xms512m -Xmx1024m'
      - xpack.security.enabled=false
      - discovery.type=single-node
    networks:
      - internal
    healthcheck:
      test: curl http://localhost:9200/_cluster/health -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '1k'
        max-file: '3'

networks:
  internal:
