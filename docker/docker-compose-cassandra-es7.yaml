# DEPRECATED - Cassandra + Elasticsearch 7 Backend
#
# This compose file previously configured AgentMesh with Cassandra,
# Elasticsearch 7, and Redis. The TypeScript rewrite of AgentMesh no longer
# supports Cassandra or Elasticsearch as backends.
#
# Supported backends:
#   - SQLite (default, zero-config) -- no compose file needed
#   - PostgreSQL                    -- see docker-compose-postgres.yaml
#   - PostgreSQL + Redis            -- see docker-compose.yaml
#
# This file is retained for reference. It will be removed in a future release.
#
# Migration: Switch to docker-compose.yaml or docker-compose-postgres.yaml.

services: {}
