version: '2.3'

services:

  agentmesh-server:
    environment:
      - CONFIG_PROP=config-mysql.properties
    image: agentmesh:server
    container_name: agentmesh-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS}
    networks:
      - internal
    ports:
      - 8000:8080
      - 8127:5000
    healthcheck:
      test: [ "CMD", "curl","-I" ,"-XGET", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 30s
      retries: 12
    links:
      - agentmesh-elasticsearch:es
      - agentmesh-mysql:mysql
      - agentmesh-redis:rs
    depends_on:
      agentmesh-elasticsearch:
        condition: service_healthy
      agentmesh-mysql:
        condition: service_healthy
      agentmesh-redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  agentmesh-mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: agentmesh
      MYSQL_USER: agentmesh
      MYSQL_PASSWORD: agentmesh
    volumes:
      - type: volume
        source: agentmesh_mysql
        target: /var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/3306'
      interval: 5s
      timeout: 5s
      retries: 12

  agentmesh-redis:
    image: redis:6.2.3-alpine
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]

  agentmesh-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - esdata-agentmesh:/usr/share/elasticsearch/data
    networks:
      - internal
    healthcheck:
      test: curl http://localhost:9200/_cluster/health -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

volumes:
  agentmesh_mysql:
    driver: local
  esdata-agentmesh:
    driver: local

networks:
  internal:
