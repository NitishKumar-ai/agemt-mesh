# AgentMesh - UI E2E Testing Stack (Playwright)
#
# Compose stack for Playwright UI integration tests. Uses distinct
# container names (-ui-e2e suffix) so it can run alongside other
# compose stacks without port or name conflicts.
#
# Build the server image once before running integration tests:
#
#   docker build -t agentmesh:server -f docker/server/Dockerfile .
#
# Then start this stack (from the repo root):
#
#   docker compose -f docker/docker-compose-ui-e2e.yaml up -d
#
# The Playwright global-setup script does this automatically when tests start.

services:
  agentmesh-server:
    image: agentmesh:server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
    container_name: agentmesh-server-ui-e2e
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=agentmesh-postgres
      - DB_PORT=5432
      - DB_USER=agentmesh
      - DB_PASSWORD=agentmesh
      - DB_NAME=agentmesh
    networks:
      - internal
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  agentmesh-postgres:
    image: postgres:16
    container_name: agentmesh-postgres-ui-e2e
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
      - POSTGRES_DB=agentmesh
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentmesh']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  internal:
