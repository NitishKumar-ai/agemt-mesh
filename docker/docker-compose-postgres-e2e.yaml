services:
  agentmesh-server:
    environment:
      - CONFIG_PROP=config-postgres.properties
      # Forwarded from the host shell when set. Empty/absent ⇒ the matching AI provider
      # stays unconfigured and the LLM e2e tests that depend on it self-skip.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    image: agentmesh:server
    container_name: agentmesh-server-e2e
    networks:
      - internal
    ports:
      - '8000:8080'
    healthcheck:
      test: ['CMD', 'curl', '-I', '-XGET', 'http://localhost:8080/health']
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - agentmesh-postgres:postgresdb
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10k'
        max-file: '3'

  agentmesh-postgres:
    image: postgres:16
    container_name: agentmesh-postgres-e2e
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
    networks:
      - internal
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '1k'
        max-file: '3'

networks:
  internal:
