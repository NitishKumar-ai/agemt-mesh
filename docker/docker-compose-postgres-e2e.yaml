# AgentMesh - E2E Testing Stack (Postgres)
#
# Minimal stack for end-to-end integration tests. Uses distinct
# container names (-e2e suffix) so it can run alongside other
# compose stacks without port or name conflicts.
#
# Services:
#   - agentmesh-server:   Node.js/NestJS server (server-lite)
#   - agentmesh-postgres: PostgreSQL 16 persistence backend
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose-postgres-e2e.yaml up -d

services:
  agentmesh-server:
    image: agentmesh:server
    container_name: agentmesh-server-e2e
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=agentmesh-postgres
      - DB_PORT=5432
      - DB_USER=agentmesh
      - DB_PASSWORD=agentmesh
      - DB_NAME=agentmesh
      # Forward API keys from the host shell when set.
      # Empty/absent means the matching AI provider stays unconfigured
      # and dependent tests self-skip.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - internal
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  agentmesh-postgres:
    image: postgres:16
    container_name: agentmesh-postgres-e2e
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
      - POSTGRES_DB=agentmesh
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentmesh']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  internal:
