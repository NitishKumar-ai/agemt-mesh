version: '2.3'

services:
  agentmesh-server:
    environment:
      - CONFIG_PROP=config-postgres.properties
      # Forwarded from the host shell when set. Empty/absent ⇒ the matching AI provider
      # stays unconfigured and the LLM e2e tests that depend on it self-skip.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    image: agentmesh:server
    container_name: agentmesh-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS}
    networks:
      - internal
    ports:
      - 8000:8080
      - 8127:5000
    healthcheck:
      test: [ "CMD", "curl","-I" ,"-XGET", "http://localhost:8080/health" ]
      interval: 60s
      timeout: 30s
      retries: 12
    links:
      - agentmesh-postgres:postgresdb
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  agentmesh-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
    volumes:
      - pgdata-agentmesh:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

volumes:
  pgdata-agentmesh:
    driver: local

networks:
  internal:
