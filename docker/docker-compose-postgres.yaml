# AgentMesh - Postgres Only Stack
#
# Services:
#   - agentmesh-server:   Node.js/NestJS server (server-lite)
#   - agentmesh-postgres: PostgreSQL 16 persistence backend
#
# This stack runs without Redis. The server uses its in-process queue
# implementation when no Redis connection is configured.
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose-postgres.yaml up -d

services:
  agentmesh-server:
    image: agentmesh:server
    container_name: agentmesh-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=agentmesh-postgres
      - DB_PORT=5432
      - DB_USER=agentmesh
      - DB_PASSWORD=agentmesh
      - DB_NAME=agentmesh
      # Forward API keys from the host shell when set.
      # Empty/absent means the matching AI provider stays unconfigured
      # and dependent tests self-skip.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - internal
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  agentmesh-postgres:
    image: postgres:16
    container_name: agentmesh-postgres
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
      - POSTGRES_DB=agentmesh
    volumes:
      - pgdata-agentmesh:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentmesh']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata-agentmesh:
    driver: local

networks:
  internal:
