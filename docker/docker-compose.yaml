# AgentMesh - Primary Docker Compose Stack
#
# Services:
#   - agentmesh-server:  Node.js/NestJS server (server-lite)
#   - agentmesh-postgres: PostgreSQL 16 persistence backend
#   - agentmesh-redis:    Redis 7 queue/cache backend
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yaml up -d
#
# The server image is built from docker/server/Dockerfile with the
# monorepo root as context. Port 8080 is exposed on the host as 8080.

services:
  agentmesh-server:
    image: agentmesh:server
    container_name: agentmesh-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_TYPE=postgres
      - DB_HOST=agentmesh-postgres
      - DB_PORT=5432
      - DB_USER=agentmesh
      - DB_PASSWORD=agentmesh
      - DB_NAME=agentmesh
      - REDIS_HOST=agentmesh-redis
      - REDIS_PORT=6379
    networks:
      - internal
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      agentmesh-postgres:
        condition: service_healthy
      agentmesh-redis:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  agentmesh-postgres:
    image: postgres:16
    container_name: agentmesh-postgres
    environment:
      - POSTGRES_USER=agentmesh
      - POSTGRES_PASSWORD=agentmesh
      - POSTGRES_DB=agentmesh
    volumes:
      - pgdata-agentmesh:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentmesh']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  agentmesh-redis:
    image: redis:7-alpine
    container_name: agentmesh-redis
    volumes:
      - redis-agentmesh:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata-agentmesh:
    driver: local
  redis-agentmesh:
    driver: local

networks:
  internal:
