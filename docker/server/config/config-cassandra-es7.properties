# Database persistence: Cassandra
agentmesh.db.type=cassandra
agentmesh.cassandra.hostAddress=cassandradb
agentmesh.cassandra.port=9042
agentmesh.cassandra.replicationFactorValue=1
agentmesh.cassandra.readConsistencyLevel=ONE
agentmesh.cassandra.writeConsistencyLevel=ONE

# Task queue: Redis (Cassandra has no native queue implementation)
agentmesh.queue.type=redis_standalone
agentmesh.redis.hosts=rs:6379:us-east-1c
agentmesh.redis-lock.serverAddress=redis://rs:6379
agentmesh.redis.taskDefCacheRefreshInterval=1
agentmesh.redis.workflowNamespacePrefix=agentmesh
agentmesh.redis.queueNamespacePrefix=agentmesh_queues

agentmesh.workflow-execution-lock.type=redis
agentmesh.app.workflowExecutionLockEnabled=true
agentmesh.app.lockTimeToTry=500

agentmesh.app.systemTaskWorkerThreadCount=20
agentmesh.app.systemTaskMaxPollCount=20

# Elasticsearch 7 indexing
agentmesh.indexing.enabled=true
agentmesh.indexing.type=elasticsearch
agentmesh.elasticsearch.url=http://es:9200
agentmesh.elasticsearch.indexName=agentmesh
agentmesh.elasticsearch.version=7
agentmesh.elasticsearch.clusterHealthColor=yellow

# Metrics
agentmesh.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Redis health indicator
management.health.redis.enabled=true

loadSample=true
