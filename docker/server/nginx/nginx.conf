# Nginx is no longer required

The AgentMesh NestJS server handles both API routing and static file serving
directly via `@nestjs/serve-static`. There is no need for a reverse proxy in
the Docker image.

This `nginx.conf` is retained as a reference for users who want to place
AgentMesh behind an external nginx reverse proxy in production.

See the configuration below for a recommended setup:

```nginx
server {
  listen 80;
  server_name agentmesh.example.com;

  location / {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
```