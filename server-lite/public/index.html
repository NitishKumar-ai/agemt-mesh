<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Mesh Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <style>
        .event-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 0.8em;
        }
        .status-running { color: #2ecc71; }
        .status-failed { color: #e74c3c; }
        .status-system { color: #3498db; }
        #killswitch-status {
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .ks-engaged { background-color: #e74c3c; color: white; }
        .ks-released { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>
    <h1>Agent Mesh 24/7</h1>
    
    <div id="killswitch-status" class="ks-released">
        SYSTEM OPERATIONAL
    </div>

    <section>
        <h2>Control Panel</h2>
        <button id="btn-run-agent">Trigger CommitGuard Agent</button>
        <button id="btn-engage-ks" style="background-color: #e74c3c;">ENGAGE KILLSWITCH</button>
        <button id="btn-release-ks" style="background-color: #2ecc71;">Release Killswitch</button>
    </section>

    <section>
        <h2>Live Event Stream</h2>
        <div id="event-log"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
