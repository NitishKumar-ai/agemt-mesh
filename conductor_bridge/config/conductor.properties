# Conductor configuration for Agent Mesh
# Backend: Postgres only (no Redis, no Elasticsearch)

conductor.db.type=postgres
conductor.queue.type=postgres
conductor.external-payload-storage.type=postgres

spring.datasource.url=jdbc:postgresql://conductor-postgres:5432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Postgres-backed indexing (no Elasticsearch required)
conductor.indexing.enabled=true
conductor.indexing.type=postgres

# Human task support (used for Agent Mesh approval gates)
conductor.app.humanTaskEnabled=true

# Workflow settings
conductor.app.ownerEmailMandatory=false
conductor.app.workflowOffsetTimeout=30
conductor.app.taskExecutionPostProcessor.enabled=true

# Rate limiting
conductor.app.maxWorkflowVariables=50
conductor.app.maxWorkflowVariablesSize=262144

# Metrics
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Disable sample data load
loadSample=false
