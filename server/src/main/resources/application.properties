spring.application.name=agentmesh
springdoc.api-docs.path=/api-docs
spring.datasource.url=jdbc:sqlite:c123.db?busy_timeout=15000&journal_mode=WAL
agentmesh.db.type=sqlite
agentmesh.queue.type=sqlite
agentmesh.indexing.type=sqlite
agentmesh.workflow-execution-lock.type=local_only
#loadSample=true
# enable name validation on workflow/task definitions
agentmesh.app.workflow.name-validation.enabled=false
agentmesh.app.ownerEmailMandatory=false

# Scheduler
agentmesh.scheduler.enabled=true

# Workflow Message Queue (WMQ) feature
agentmesh.workflow-message-queue.enabled=false
agentmesh.workflow-message-queue.maxQueueSize=1000
agentmesh.workflow-message-queue.ttlSeconds=86400
agentmesh.workflow-message-queue.maxBatchSize=100

# Redis cluster connection in SSL mode
#agentmesh.redis.ssl=false

# agentmesh.indexing.enabled=false

#Redis configuration details.
#format is host:port:rack separated by semicolon
#Auth is supported. Password is taken from host[0]. format: host:port:rack:password
#agentmesh.redis.hosts=host1:port:rack;host2:port:rack:host3:port:rack
#agentmesh.redis.hosts=localhost:6379:us-east-1c

#namespace for the keys stored in Dynomite/Redis
agentmesh.redis.workflowNamespacePrefix=

#namespace prefix for the dyno queues
agentmesh.redis.queueNamespacePrefix=

#no. of threads allocated to dyno-queues
queues.dynomite.threads=10

#non-quorum port used to connect to local redis.  Used by dyno-queues
agentmesh.redis.queuesNonQuorumPort=22122

# For a single node dynomite or redis server, make sure the value below is set to same as rack specified in the "workflow.dynomite.cluster.hosts" property.
agentmesh.redis.availabilityZone=us-east-1c
#agentmesh.redis.maxIdleConnections=8
#agentmesh.redis.minIdleConnections=5
#agentmesh.redis.minEvictableIdleTimeMillis = 1800000
#agentmesh.redis.timeBetweenEvictionRunsMillis = -1L
#agentmesh.redis.testWhileIdle = false
#agentmesh.redis.numTestsPerEvictionRun = 3

#Transport address to elasticsearch
#agentmesh.elasticsearch.url=localhost:9300

#Name of the elasticsearch cluster
agentmesh.elasticsearch.indexName=agentmesh

#Elasticsearch major release version (7 or 8).
#agentmesh.elasticsearch.version=7
#agentmesh.elasticsearch.version=7

# Default event queue type to listen on for wait task
agentmesh.default-event-queue.type=sqs

