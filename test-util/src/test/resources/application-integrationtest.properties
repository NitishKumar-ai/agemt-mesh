agentmesh.db.type=memory
# disable trying to connect to redis and use in-memory
agentmesh.queue.type=xxx
agentmesh.workflow-execution-lock.type=local_only
agentmesh.external-payload-storage.type=dummy
agentmesh.indexing.enabled=true
agentmesh.indexing.type=postgres

agentmesh.app.stack=test
agentmesh.app.appId=agentmesh

agentmesh.app.workflow-offset-timeout=30s

agentmesh.system-task-workers.enabled=false
agentmesh.app.system-task-worker-callback-duration=0

agentmesh.app.event-message-indexing-enabled=true
agentmesh.app.event-execution-indexing-enabled=true

agentmesh.app.workflow-execution-lock-enabled=false

agentmesh.app.workflow-input-payload-size-threshold=10KB
agentmesh.app.max-workflow-input-payload-size-threshold=10240KB
agentmesh.app.workflow-output-payload-size-threshold=10KB
agentmesh.app.max-workflow-output-payload-size-threshold=10240KB
agentmesh.app.task-input-payload-size-threshold=10KB
agentmesh.app.max-task-input-payload-size-threshold=10240KB
agentmesh.app.task-output-payload-size-threshold=10KB
agentmesh.app.max-task-output-payload-size-threshold=10240KB
agentmesh.app.max-workflow-variables-payload-size-threshold=2KB

agentmesh.redis.availability-zone=us-east-1c
agentmesh.redis.data-center-region=us-east-1
agentmesh.redis.workflow-namespace-prefix=integration-test
agentmesh.redis.queue-namespace-prefix=integtest

agentmesh.indexing.index-prefix=agentmesh
agentmesh.indexing.cluster-health-color=yellow

management.metrics.export.datadog.enabled=false
