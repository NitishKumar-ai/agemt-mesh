name: Security Scan

on:
  push:
    branches: ["friday/development/agent_mesh", "main"]
  pull_request:
    branches: ["friday/development/agent_mesh", "main"]
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scanning

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
          pip-audit -r requirements.txt

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json

      - name: Node audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  inmodel-commitguard:
    name: CommitGuard Self-Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CommitGuard on PR diff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff HEAD~1 HEAD -- '*.py' > /tmp/pr_diff.txt
          echo "=== PR Diff for CommitGuard ==="
          wc -l /tmp/pr_diff.txt
          python3 -c "
          import sys
          with open('/tmp/pr_diff.txt') as f:
              diff = f.read()
          if not diff.strip():
              print('No Python changes — skipping CommitGuard')
              sys.exit(0)
          print(f'Scanning {len(diff)} bytes of diff...')
          # Lightweight pattern check (full CommitGuard needs API keys)
          import re
          patterns = [
              (r'os\.system\(', 'Potential command injection via os.system'),
              (r'subprocess\.call\(.+shell=True', 'Shell injection risk'),
              (r'eval\(', 'Dangerous eval() usage'),
              (r'exec\(', 'Dangerous exec() usage'),
              (r'(?i)(api_key|secret|password)\s*=\s*[\"\\'][^\"\\']{8,}', 'Hardcoded credential'),
              (r'pickle\.loads?\(', 'Unsafe pickle deserialization'),
          ]
          findings = []
          for pattern, desc in patterns:
              matches = re.findall(pattern, diff)
              if matches:
                  findings.append(f'  [{desc}]: {len(matches)} match(es)')
          if findings:
              print('CommitGuard findings:')
              for f in findings:
                  print(f)
              sys.exit(1)
          else:
              print('CommitGuard: No critical patterns detected')
          "
        continue-on-error: true  # non-blocking until full API wiring
