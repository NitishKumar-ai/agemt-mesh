name: Deploy to Google Cloud

on:
  push:
    branches: ["friday/development/agent_mesh"]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write  # for Workload Identity Federation

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/agent-mesh/api

jobs:
  build-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --tag $IMAGE:${{ github.sha }} \
            --tag $IMAGE:latest \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Output image
        id: meta
        run: echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agent-mesh-api
          image: ${{ needs.build-push.outputs.image }}
          region: ${{ env.GCP_REGION }}
          flags: |
            --port=8000
            --memory=2Gi
            --cpu=2
            --min-instances=1
            --max-instances=10
            --set-env-vars=GCP_PROJECT=${{ vars.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }}
            --set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=database-url:latest

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-cloud-run
    steps:
      - name: Health check
        run: |
          URL="${{ needs.deploy-cloud-run.outputs.url || 'https://agent-mesh-api-placeholder.run.app' }}"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
        continue-on-error: true
