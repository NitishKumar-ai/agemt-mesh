steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'agent-mesh',
        '--image',
        '${_IMAGE}',
        '--region',
        '${_REGION}',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        '--port',
        '8080',
        '--memory',
        '2Gi',
        '--cpu',
        '2',
        '--min-instances',
        '1',
        '--max-instances',
        '10',
        '--set-env-vars',
        'APP_DATABASE_URL=${_DB_URL}',
      ]
substitutions:
  _IMAGE: gcr.io/${PROJECT_ID}/agent-mesh:latest
  _REGION: us-central1
  _DB_URL: postgresql://...
