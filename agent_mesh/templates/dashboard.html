<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Mesh OS | Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary-light: #0066CC;
  --color-primary-dark: #2997FF;
  --color-bg-light: #F5F5F7;
  --color-panel-light: #FFFFFF;
  --color-text-light: #1D1D1F;
  --color-muted-light: #86868B;
  --color-border-light: #E5E5EA;
  --color-bg-dark: #000000;
  --color-panel-dark: #1C1C1E;
  --color-text-dark: #F5F5F7;
  --color-muted-dark: #86868B;
  --color-border-dark: #38383A;
  
  --color-success: #34C759;
  --color-warning: #FF9F0A;
  --color-error: #FF3B30;
  --color-blocked: #FF9F0A;
  --color-idle: #8E8E93;
  --color-planning: #5E5CE6;
  --color-executing: #007AFF;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  
  --bg: var(--color-bg-light);
  --panel: var(--color-panel-light);
  --text: var(--color-text-light);
  --muted: var(--color-muted-light);
  --border: var(--color-border-light);
  --primary: var(--color-primary-light);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--color-bg-dark);
    --panel: var(--color-panel-dark);
    --text: var(--color-text-dark);
    --muted: var(--color-muted-dark);
    --border: var(--color-border-dark);
    --primary: var(--color-primary-dark);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* TOP NAVBAR: GLOBAL HEALTH & KILLSWITCH */
.top-nav {
  height: 56px;
  background-color: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  z-index: 100;
}

.nav-brand {
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.system-health {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--success);
  font-weight: 500;
}
.health-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 8px var(--success);
}

.killswitch {
  background-color: rgba(255, 59, 48, 0.1);
  color: var(--color-error);
  border: 1px solid rgba(255, 59, 48, 0.3);
  padding: 6px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.killswitch:hover {
  background-color: var(--color-error);
  color: white;
}

/* MAIN LAYOUT */
.layout-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* LEFT SIDEBAR: AGENT ROSTER & WORKFLOWS */
.sidebar {
  width: 260px;
  background-color: var(--bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar h2 {
  font-size: 13px;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin: 0 0 16px 8px;
}

.agent-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.2s;
  background-color: var(--panel);
  border: 1px solid var(--border);
}

.agent-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 600;
  font-size: 14px;
}
.agent-info { flex: 1; overflow: hidden; }
.agent-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-state-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  margin-top: 4px;
  text-transform: uppercase;
}
.state-idle { background: rgba(142,142,147,0.1); color: var(--color-idle); }
.state-planning { background: rgba(94,92,230,0.1); color: var(--color-planning); }
.state-executing { background: rgba(0,122,255,0.1); color: var(--color-executing); }
.state-blocked { background: rgba(255,159,10,0.1); color: var(--color-blocked); border: 1px solid var(--color-blocked); }
.state-failed { background: rgba(255,59,48,0.1); color: var(--color-error); }
.state-success { background: rgba(52,199,89,0.1); color: var(--color-success); }

/* MAIN WORKSPACE: CHAT & LOGS */
.main-workspace {
  flex: 1;
  background-color: var(--panel);
  display: flex;
  flex-direction: column;
  min-width: 0; 
}

.feed {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.message {
  display: flex;
  gap: 16px;
  max-width: 800px;
}

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
}
.msg-avatar.user { background: var(--muted); }
.msg-avatar.agent { background: #AF52DE; color: #fff; display:flex; align-items:center; justify-content:center; font-weight: 600; }

.msg-content { flex: 1; }
.msg-author { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;}
.msg-time { font-size: 12px; color: var(--muted); font-weight: 400; }
.msg-body {
  font-size: 15px;
  line-height: 1.6;
  color: var(--text);
}

.code-block {
  margin-top: 12px;
  background: #1C1C1E;
  color: #F5F5F7;
  border-radius: var(--radius-md);
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  overflow-x: auto;
  border: 1px solid #38383A;
}

/* DIFF VIEWER FOR APPROVALS */
.diff-viewer {
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg);
}
.diff-header {
  background: var(--panel);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
}
.diff-actions button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  margin-left: 8px;
}
.btn-approve { background: var(--color-success); color: white; }
.btn-reject { background: var(--color-error); color: white; }
.diff-content {
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.diff-add { color: var(--color-success); background: rgba(52,199,89,0.1); }
.diff-sub { color: var(--color-error); background: rgba(255,59,48,0.1); }

.input-area {
  padding: 24px 32px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.input-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03);
}
.input-box input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 15px;
  color: var(--text);
  outline: none;
  font-family: var(--font-sans);
}

</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Agent Mesh OS
    <div class="system-health"><div class="health-dot"></div> Operational</div>
  </div>
  <button class="killswitch" onclick="alert('KILLSWITCH ENGAGED! Revoking all API keys and terminating DBOS workflows.')">EMERGENCY STOP ALL</button>
</div>

<div class="layout-body">
  <div class="sidebar" id="agent-roster">
    <h2>Active Agents</h2>
    <!-- Agents dynamically added here -->
  </div>

  <div class="main-workspace">
    <div class="feed" id="feed">
      <!-- Messages will be injected here via SSE -->
    </div>

    <div class="input-area">
      <div class="input-box">
        <input type="text" id="prompt-input" placeholder="Give the Agent Mesh a goal..." />
      </div>
    </div>
  </div>
</div>

<script>
// Agent State Tracker
const agents = {};

function updateAgentState(agentId, state) {
  if (!agents[agentId]) {
    agents[agentId] = { state: 'idle' };
    const roster = document.getElementById("agent-roster");
    const div = document.createElement("div");
    div.id = `agent-${agentId}`;
    div.className = "agent-item";
    div.innerHTML = `
      <div class="agent-avatar">${agentId.charAt(0)}</div>
      <div class="agent-info">
        <div class="agent-name">${agentId}</div>
        <div class="agent-state-badge state-${state.toLowerCase()}" id="badge-${agentId}">${state}</div>
      </div>
    `;
    roster.appendChild(div);
  } else {
    const badge = document.getElementById(`badge-${agentId}`);
    if (badge) {
      badge.className = `agent-state-badge state-${state.toLowerCase()}`;
      badge.innerText = state;
    }
  }
}

function appendMessage(agent, text, type = "text", payload = null) {
  const feed = document.getElementById("feed");
  const msg = document.createElement("div");
  msg.className = "message";
  
  const isUser = agent === "User";
  const avatarClass = isUser ? "user" : "agent";
  const avatarLetter = isUser ? "U" : agent.charAt(0);
  const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  
  let contentHtml = `<div class="msg-body">${text}</div>`;
  
  if (type === "diff" && payload) {
    contentHtml += `
      <div class="diff-viewer">
        <div class="diff-header">
          <span>Pending Approval: CommitGuard Diff</span>
          <div class="diff-actions">
            <button class="btn-reject" onclick="this.parentNode.parentNode.parentNode.innerHTML='<div style=\\'padding: 16px;\\'>Rejected.</div>'">Reject</button>
            <button class="btn-approve" onclick="this.parentNode.parentNode.parentNode.innerHTML='<div style=\\'padding: 16px;\\'>Approved via Webhook signature.</div>'">Approve</button>
          </div>
        </div>
        <div class="diff-content"><span class="diff-add">+ ${payload.add}</span><br><span class="diff-sub">- ${payload.sub}</span></div>
      </div>
    `;
  } else if (type === "code" && payload) {
    contentHtml += `<div class="code-block">${payload.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
  }

  msg.innerHTML = `
    <div class="msg-avatar ${avatarClass}">${avatarLetter}</div>
    <div class="msg-content">
      <div class="msg-author">${agent} <span class="msg-time">${time}</span></div>
      ${contentHtml}
    </div>
  `;
  feed.appendChild(msg);
  feed.scrollTop = feed.scrollHeight;
}

const evtSource = new EventSource("/stream");
evtSource.onmessage = function(event) {
  try {
    const data = JSON.parse(event.data);
    const agentId = data.agent_id;
    const evtType = data.event_type;
    const payload = data.payload;
    
    // Update State Badge
    if (payload && payload.status) {
      updateAgentState(agentId, payload.status);
    }
    
    if (evtType === "plan_created") {
      appendMessage(agentId, "Created plan: " + payload.plan_steps + " steps.");
    } else if (evtType === "execution_completed") {
      appendMessage(agentId, "Completed execution: " + payload.result);
    } else if (evtType === "review_completed") {
      appendMessage(agentId, "Review verdict: " + (payload.verdict.passed ? "Passed" : "Failed") + " - " + payload.verdict.feedback);
    } else if (evtType === "approval_required") {
      appendMessage(agentId, "Approval required for operation.", "diff", payload.diff);
    }
  } catch (e) {
    console.error("Error parsing event", e);
  }
};

const input = document.getElementById("prompt-input");
input.addEventListener("keypress", async (e) => {
  if (e.key === "Enter" && input.value.trim() !== "") {
    const text = input.value.trim();
    input.value = "";
    appendMessage("User", text);
    
    await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ context: text })
    });
  }
});

// Mock Initial State
updateAgentState('CommitGuardAgent', 'Idle');
updateAgentState('ResearchAgent', 'Idle');
</script>
</body>
</html>
