version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: agent_mesh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  conductor:
    image: conductoross/conductor:latest
    ports:
      - "8080:8080"
    environment:
      - CONDUCTOR_EXTERNAL_PAYLOAD_STORAGE=db
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
