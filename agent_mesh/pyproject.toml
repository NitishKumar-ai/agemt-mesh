[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mesh"
version = "0.1.0"
description = "A CLI starter kit for a local, durable Agent Mesh OS based on DBOS."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Solo Founder", email = "founder@example.com" }
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
agent-mesh = "agent_mesh.cli:app"

[tool.setuptools.packages.find]
include = ["agent_mesh*"]

[tool.setuptools.package-data]
agent_mesh = ["templates/*", "templates/tests/*"]
