# ---------------------------------------------------------------------------
# AgentMesh -- Root docker-compose for local development
#
# Starts the server with Postgres and Redis.
# Usage: docker compose up -d --build
# ---------------------------------------------------------------------------

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-8080}:8080'
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-agentmesh}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - E2B_API_KEY=${E2B_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-deterministic}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-signed-feature-hash-v1}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      - ALLOW_DETERMINISTIC_EMBEDDINGS=${ALLOW_DETERMINISTIC_EMBEDDINGS:-true}
      - VECTOR_STORE=pgvector
      - VECTOR_DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-agentmesh}
      - VECTOR_HNSW_EF_SEARCH=${VECTOR_HNSW_EF_SEARCH:-100}
      # Durable graph "memory": NEO4J_URI drives Neo4jClient to the real backend.
      # When unset the client falls back to its in-memory store (see Neo4jClient).
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-agentmesh-dev}
      - JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health | grep -q OK || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
      - POSTGRES_DB=${DB_NAME:-agentmesh}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agentmesh}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      # Single-user dev auth; NEO4J_PASSWORD must match the server's NEO4J_PASSWORD.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-agentmesh-dev}
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
